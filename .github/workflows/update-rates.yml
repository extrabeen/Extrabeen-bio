name: Update Nobitex Rates

on:
  schedule:
    # Runs every 6 hours (at 00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual 1-click execution from GitHub Actions

permissions:
  contents: write

jobs:
  update-rates:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run rate updater script
        run: |
          python scripts/update_rates.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add ads-rates.html
          if git diff --staged --quiet; then
            echo "No rate changes to commit."
          else
            git commit -m "chore(rates): auto-update rates from Nobitex USDT [skip ci]"
            git push
          fi
